{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block page_sub %}Guest profile{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="content-card">
      <div class="card-header"><i class="bi bi-person-vcard-fill me-2"></i>{{ title }}</div>
      <div class="card-body">
        <form method="POST">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Full Name *</label>
              <input type="text" name="name" class="form-control" value="{{ customer.name if customer else '' }}" required/>
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input type="text" name="phone" class="form-control" value="{{ customer.phone if customer else '' }}"/>
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-control" value="{{ customer.email if customer else '' }}"/>
            </div>
            <div class="col-md-6">
              <label class="form-label">Nationality</label>
              <input type="text" name="nationality" class="form-control" value="{{ customer.nationality if customer else 'Indian' }}"/>
            </div>
            <div class="col-md-4">
              <label class="form-label">ID Type</label>
              <select name="id_type" class="form-select">
                {% for t in ['Passport','Aadhaar Card',"Driver's License",'Voter ID','PAN Card'] %}
                <option {% if customer and customer.id_type==t %}selected{% endif %}>{{ t }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">ID Number</label>
              <input type="text" name="id_number" class="form-control" value="{{ customer.id_number if customer else '' }}"/>
            </div>
            <div class="col-md-4">
              <label class="form-label">Date of Birth</label>
              <input type="date" name="date_of_birth" class="form-control" value="{{ customer.date_of_birth if customer else '' }}"/>
            </div>
            <div class="col-12">
              <label class="form-label">Address</label>
              <textarea name="address" class="form-control" rows="3">{{ customer.address if customer else '' }}</textarea>
            </div>
          </div>
          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-navy"><i class="bi bi-save me-1"></i>Save Customer</button>
            <a href="{{ url_for('customers') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
